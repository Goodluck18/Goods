<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 110" width="100%" height="100%">
  <!-- Goodlucks Official Parent Company Logo with Slogan -->
  <style>
    .gl-parent-good { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 46px; fill: #252A34; letter-spacing: -0.5px; }
    .gl-parent-lucks { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 46px; fill: #FF2E63; letter-spacing: -0.5px; }
    .gl-parent-slogan { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-style: italic; font-weight: 500; font-size: 14px; fill: #64748B; letter-spacing: 0.2px; }
  </style>
  <g transform="translate(20, 52)">
    <!-- Wordmark -->
    <text x="0" y="0">
      <tspan class="gl-parent-good">Good</tspan><tspan class="gl-parent-lucks">lucks</tspan>
    </text>
    <!-- Slogan directly below -->
    <text x="2" y="32" class="gl-parent-slogan">A Brand For You, With You &amp; For Generations</text>
  </g>
</svg>
