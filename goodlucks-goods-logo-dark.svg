<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 100" width="100%" height="100%">
  <!-- Goodlucks Goods Official Brand Logo (Dark Background Version) -->
  <style>
    .gl-good-dark { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 46px; fill: #FFFFFF; letter-spacing: -0.5px; }
    .gl-lucks-dark { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 46px; fill: #FF2E63; letter-spacing: -0.5px; }
    .gl-goods-dark { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 26px; fill: #08D9D6; letter-spacing: 0.5px; }
  </style>
  <g transform="translate(10, 52)">
    <!-- Main wordmark -->
    <text x="0" y="0">
      <tspan class="gl-good-dark">Good</tspan><tspan class="gl-lucks-dark">lucks</tspan>
    </text>
    <!-- Sub-brand "Goods" aligned under lucks -->
    <text x="135" y="28" class="gl-goods-dark">Goods</text>
    <!-- Accent line under Goods -->
    <rect x="135" y="34" width="80" height="4" rx="2" fill="#FF2E63" />
  </g>
</svg>
